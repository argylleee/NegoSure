<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<!--
THESIS: Requirements read as ledger rows to settle, each with a tally
box, not status-colored SaaS badges -- continuing the Home screen's
committed ledger world rather than reinventing per screen.
OWN-WORLD: Same tokens as design/mocks/home-ledger/Main.dc.html --
paper ground, ink rules, red reserved for action-required only, violet
stamp for verified/official (eLGU sync, settled).
STORY: Owner scans down a ruled list the way they'd scan their own
utang ledger -- what's checked off, what's still open, what needs
action today (in red).
FIRST VIEWPORT: Header with a ledger-style totals line ("4 of 8
settled"), plain-text status filter row (active = underlined, not
colored), ruled requirement rows with tally box + title + reason +
status note + gov-sync stamp.
FORM: extends the committed ledger world; no new direction round.
FINISH: unreviewed and undocumented is unfinished; this build ends
with the finish review, the verdict, DESIGN.md, and every shipping
raster carrying its provenance.
-->
<helmet>
  <style>
    :root{
      --paper: oklch(97% 0.008 85);
      --paper-raised: oklch(99% 0.004 85);
      --line: oklch(85% 0.02 250);
      --line-strong: oklch(72% 0.03 250);
      --ink: oklch(28% 0.045 255);
      --ink-soft: oklch(46% 0.03 255);
      --ink-faint: oklch(58% 0.025 255);
      --red: oklch(46% 0.17 25);
      --red-soft: oklch(94% 0.03 25);
      --stamp: oklch(38% 0.09 292);
      --stamp-soft: oklch(94% 0.025 292);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Schibsted Grotesk", system-ui, sans-serif;background:#0b0c0c;}
    .num{font-variant-numeric:tabular-nums;}
    .screen{
      width:390px;height:844px;background:var(--paper);position:relative;
      display:flex;flex-direction:column;overflow:hidden;
      box-shadow:0 40px 80px -30px rgba(0,0,0,0.55);
    }
    .scroll{flex:1;overflow-y:auto;}
    .scroll::-webkit-scrollbar{display:none;}
    .filterRow{display:flex;gap:18px;overflow-x:auto;}
    .filterRow::-webkit-scrollbar{display:none;}
  </style>
</helmet>

<div class="screen">

  <!-- Header -->
  <div style="padding:24px 22px 4px;display:flex;flex-direction:column;gap:16px;flex-shrink:0;">
    <span style="font-size:21px;color:var(--ink);font-weight:700;">Requirements</span>

    <div style="display:flex;flex-direction:column;">
      <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 0 8px;">
        <span style="font-size:12.5px;color:var(--ink-soft);font-weight:500;">Total settled</span>
        <span class="num" style="font-size:18px;color:var(--ink);font-weight:700;">{{settledCount}} / {{totalCount}}</span>
      </div>
      <div style="border-bottom:1px solid var(--line-strong);"></div>
      <div style="border-bottom:2.5px solid var(--ink);margin-top:2px;"></div>
    </div>

    <div class="filterRow">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <div style="flex-shrink:0;padding-bottom:8px;border-bottom:2px solid {{f.underline}};">
          <span style="font-size:12.5px;font-weight:700;white-space:nowrap;color:{{f.color}};">{{f.label}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- List -->
  <div class="scroll">
    <div style="padding:6px 22px 20px;display:flex;flex-direction:column;">

      <sc-for list="{{requirements}}" as="r" hint-placeholder-count="4">
        <div style="border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:8px;">

          <div style="display:flex;align-items:flex-start;gap:12px;">
            <div style="width:20px;height:20px;border:1.6px solid {{r.boxColor}};border-radius:3px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;">
              <sc-if value="{{r.checked}}" hint-placeholder-val="false">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{r.boxColor}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
              </sc-if>
              <sc-if value="{{r.dotted}}" hint-placeholder-val="false">
                <span style="width:6px;height:6px;border-radius:50%;background:{{r.boxColor}};"></span>
              </sc-if>
            </div>

            <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0;">
              <span style="font-size:14px;color:var(--ink);font-weight:600;line-height:1.3;">{{r.title}}</span>
              <span style="font-size:11.5px;color:var(--ink-faint);font-weight:500;line-height:1.35;">{{r.reason}}</span>
            </div>
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;padding-left:32px;">
            <div style="display:flex;align-items:center;gap:10px;">
              <span style="font-size:11.5px;color:{{r.statusColor}};font-weight:700;">{{r.statusLabel}}</span>
              <span style="font-size:11px;color:var(--ink-faint);font-weight:500;">{{r.source}}</span>
            </div>
            <sc-if value="{{r.hasGovService}}" hint-placeholder-val="true">
              <div style="display:flex;align-items:center;padding:3px 8px;border-radius:3px;background:var(--stamp-soft);transform:rotate(-1.5deg);">
                <span style="font-size:10px;color:var(--stamp);font-weight:700;letter-spacing:0.02em;">eLGU SYNCED</span>
              </div>
            </sc-if>
          </div>

        </div>
      </sc-for>

    </div>
  </div>

  <!-- Bottom tab bar -->
  <div style="display:flex;align-items:center;justify-content:space-around;padding:12px 8px calc(8px + 18px);background:var(--paper-raised);border-top:1.5px solid var(--ink);flex-shrink:0;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span style="font-size:10px;color:var(--ink-faint);font-weight:600;">Home</span>
      <div style="width:16px;height:2px;background:transparent;"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 11 13.5 15.5 9"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
      <span style="font-size:10px;color:var(--ink);font-weight:700;">Requirements</span>
      <div style="width:16px;height:2px;background:var(--ink);border-radius:2px;"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
      <span style="font-size:10px;color:var(--ink-faint);font-weight:600;">Documents</span>
      <div style="width:16px;height:2px;background:transparent;"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span style="font-size:10px;color:var(--ink-faint);font-weight:600;">Assistant</span>
      <div style="width:16px;height:2px;background:transparent;"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      <span style="font-size:10px;color:var(--ink-faint);font-weight:600;">Profile</span>
      <div style="width:16px;height:2px;background:transparent;"></div>
    </div>

  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const status = {
      NOT_STARTED:     { label: 'Not started',    color: 'var(--ink-faint)', box: 'var(--ink-faint)', checked: false, dotted: false },
      IN_PROGRESS:     { label: 'In progress',     color: 'var(--ink-soft)',  box: 'var(--ink-soft)',  checked: false, dotted: true },
      READY:           { label: 'Ready to submit', color: 'var(--ink)',       box: 'var(--ink)',       checked: false, dotted: true },
      SUBMITTED:       { label: 'Submitted',       color: 'var(--stamp)',     box: 'var(--stamp)',     checked: false, dotted: true },
      COMPLETED:       { label: 'Settled',         color: 'var(--stamp)',     box: 'var(--stamp)',     checked: true,  dotted: false },
      ACTION_REQUIRED: { label: 'Action required', color: 'var(--red)',       box: 'var(--red)',       checked: false, dotted: false }
    };
    const mk = (title, reason, source, st, hasGovService) => {
      const s = status[st];
      return {
        title, reason, source,
        statusLabel: s.label, statusColor: s.color, boxColor: s.box,
        checked: s.checked, dotted: s.dotted,
        hasGovService
      };
    };
    return {
      settledCount: 4, totalCount: 8,
      filters: [
        { label: 'All', color: 'var(--ink)', underline: 'var(--ink)' },
        { label: 'Action required', color: 'var(--ink-soft)', underline: 'transparent' },
        { label: 'In progress', color: 'var(--ink-soft)', underline: 'transparent' },
        { label: 'Settled', color: 'var(--ink-soft)', underline: 'transparent' }
      ],
      requirements: [
        mk('Fire Safety Inspection Certificate', 'Applies — you prepare food on-site', 'BFP', 'ACTION_REQUIRED', true),
        mk('Sanitary Permit', 'Applies — food & beverage business', 'City Health Office', 'IN_PROGRESS', false),
        mk('Business Permit Renewal', 'Applies — annual requirement', 'LGU Dasmariñas', 'SUBMITTED', true),
        mk('BIR Certificate of Registration', 'Applies — all registered businesses', 'BIR', 'COMPLETED', false)
      ]
    };
  }
}
</script>
</body>
</html>
